name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  # Never let application start-up install packages in CI; dependencies are
  # resolved at build time and pinned, or the build is not reproducible.
  DARTHAWK_AUTO_INSTALL: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Capture Inspector shells out to tshark for every packet decode, so the
      # test runner needs it exactly as production does.
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Install dependencies
        run: |
          pip install -r packages/capture_inspector/requirements.txt
          pip install -r packages/darthawk/requirements.txt
          pip install -r requirements-dev.txt
      - name: Unit and integration tests
        run: pytest -m "not golden" --tb=short
      - name: Golden tests
        run: pytest -m golden --tb=short
        # Golden fixtures are still being curated (see docs/ASSESSMENT.md 10.3).
        # This step must lose continue-on-error before Phase 1 is considered done.
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.7.3
      - name: Audit dependencies
        run: |
          pip-audit -r packages/capture_inspector/requirements.txt
          pip-audit -r packages/darthawk/requirements.txt
      # Uploads are captures and DART bundles; both are sensitive. A fixture
      # committed by mistake must fail the build, not be discovered later.
      - name: Reject sensitive artifacts in the tree
        run: |
          if git ls-files | grep -Ei '\.(pcap|pcapng|har|keylog|keys)$'; then
            echo "::error::Capture or key material must never be committed."
            exit 1
          fi

  build:
    # ATLAS is deployed directly onto the host, so the artifact under test is the
    # install itself: a virtualenv built from pinned requirements, started the
    # same way production starts it. This job exists to prove the run scripts and
    # the package layout work on a clean machine.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Install as production does
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install \
            -r packages/capture_inspector/requirements.txt \
            -r packages/darthawk/requirements.txt \
            -r requirements-web.txt
      - name: Start the unified shell
        env:
          PYTHONPATH: packages/capture_inspector:packages/darthawk:packages/atlas_core:apps
          DARTHAWK_AUTO_INSTALL: "0"
        run: |
          .venv/bin/uvicorn web.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/atlas.pid
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null && break || sleep 2
          done
      - name: Verify both engines are reachable
        run: |
          curl -sf http://127.0.0.1:8000/healthz
          # tshark is installed above, so a degraded report here is a real failure.
          curl -sf http://127.0.0.1:8000/healthz | grep -q '"available": *true' \
            || { echo "::error::tshark not detected by the running app"; exit 1; }
          curl -sf http://127.0.0.1:8000/capture/api/health
          curl -sf -o /dev/null -w 'bundle:%{http_code}\n' http://127.0.0.1:8000/bundle/
      - name: Stop
        if: always()
        run: kill "$(cat /tmp/atlas.pid)" 2>/dev/null || true

  launchers:
    # The desktop launchers are a supported entry point (macOS and Windows for
    # now), so they are checked for syntax rather than assumed to work.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check run.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/run.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Check run.sh parses
        if: runner.os != 'Windows'
        run: bash -n run.sh

