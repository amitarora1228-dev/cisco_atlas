<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DartHawk Analysis Tool{% endblock %}</title>
    <script>
        (function () {
            try {
                var storedTheme = localStorage.getItem('darthawkTheme');
                if (storedTheme === 'darker') {
                    document.documentElement.classList.add('theme-darker');
                }
            } catch (_error) {
                // Ignore storage access failures.
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Preflight is an unscoped global reset. ATLAS hosts this UI alongside
        // Capture Inspector's own stylesheet, which preflight would overwrite.
        tailwind.config = { corePlugins: { preflight: false } };
    </script>
    <link rel="stylesheet" href="/atlas/atlas-tokens.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="dh-app">
    <div class="top-toolbar" aria-label="Display controls">
        <button type="button" id="readmeToggle" class="top-toolbar-btn" aria-label="Open Read Me" title="What is DartHawk?">
            Read Me
        </button>
        <button type="button" id="feedbackToggle" class="top-toolbar-btn" aria-label="Open feedback form" title="Open feedback form">
            Feedback
        </button>
        <button type="button" id="themeToggle" class="top-toolbar-btn" aria-label="Enable darker theme" title="Enable darker theme">
            Darker Theme: Off
        </button>
    </div>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
    <script>
        (function () {
            var toggleButton = document.getElementById('themeToggle');
            var feedbackButton = document.getElementById('feedbackToggle');
            var feedbackPanel = document.getElementById('feedbackPanel');
            var readmeButton = document.getElementById('readmeToggle');
            var readmePanel = document.getElementById('readmePanel');
            if (!toggleButton) {
                return;
            }

            function isDarkerThemeEnabled() {
                return document.documentElement.classList.contains('theme-darker');
            }

            function syncToggleLabel() {
                var enabled = isDarkerThemeEnabled();
                toggleButton.textContent = enabled ? 'Darker Theme: On' : 'Darker Theme: Off';
                toggleButton.setAttribute('aria-label', enabled ? 'Disable darker theme' : 'Enable darker theme');
                toggleButton.setAttribute('title', enabled ? 'Disable darker theme' : 'Enable darker theme');
            }

            toggleButton.addEventListener('click', function () {
                var shouldEnable = !isDarkerThemeEnabled();
                document.documentElement.classList.toggle('theme-darker', shouldEnable);
                try {
                    localStorage.setItem('darthawkTheme', shouldEnable ? 'darker' : 'default');
                } catch (_error) {
                    // Ignore storage access failures.
                }
                syncToggleLabel();
            });

            function isFeedbackPanelVisible() {
                return Boolean(feedbackPanel && !feedbackPanel.classList.contains('hidden'));
            }

            function syncFeedbackLabel() {
                if (!feedbackButton) {
                    return;
                }
                var visible = isFeedbackPanelVisible();
                feedbackButton.textContent = 'Feedback';
                feedbackButton.setAttribute('aria-label', visible ? 'Hide feedback form' : 'Show feedback form');
                feedbackButton.setAttribute('title', visible ? 'Hide feedback form' : 'Show feedback form');
            }

            if (feedbackButton) {
                if (!feedbackPanel) {
                    feedbackButton.classList.add('hidden');
                } else {
                    feedbackButton.addEventListener('click', function () {
                        var nextVisible = !isFeedbackPanelVisible();
                        feedbackPanel.classList.toggle('hidden', !nextVisible);
                        if (nextVisible) {
                            try {
                                feedbackPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            } catch (_scrollError) {
                                feedbackPanel.scrollIntoView(true);
                            }
                        }
                        syncFeedbackLabel();
                    });
                    syncFeedbackLabel();
                }
            }

            function isReadmePanelVisible() {
                return Boolean(readmePanel && !readmePanel.classList.contains('hidden'));
            }

            if (readmeButton) {
                if (!readmePanel) {
                    readmeButton.classList.add('hidden');
                } else {
                    readmeButton.addEventListener('click', function () {
                        var nextVisible = !isReadmePanelVisible();
                        readmePanel.classList.toggle('hidden', !nextVisible);
                        if (nextVisible) {
                            try {
                                readmePanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            } catch (_scrollError) {
                                readmePanel.scrollIntoView(true);
                            }
                        }
                    });
                }
            }

            syncToggleLabel();
        })();
    </script>
</body>
</html>
